<!DOCTYPE html>
<html>
<head>
  <title>Plant Care Report</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<h2>Urban Greentech – Plant Care Report</h2>

<form id="plantForm">

  <input type="text" id="plantName" placeholder="Plant Name" required>

  <select id="location" required>
    <option value="">Select Location</option>
    <option>Balcony</option>
    <option>Bedroom</option>
    <option>Kitchen</option>
    <option>Living Room</option>
  </select>

  <input type="number" id="frequency"
         placeholder="Watering Frequency (days)" required>

  <input type="date" id="lastWatered" required>

  <textarea id="notes"
            placeholder="Plant Condition Notes"></textarea>

  <button type="submit">Submit Report</button>

</form>

<div id="message"></div>

<br>
<a href="view.html">View Submissions</a>

<script src="script.js"></script>
</body>
</html>
